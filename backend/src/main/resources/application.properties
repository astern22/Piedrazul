spring.application.name=piedrazul

spring.datasource.url=jdbc:postgresql://localhost:5432/piedrazuldb?currentSchema=piedrazul
spring.datasource.username=piedrazul_admin
spring.datasource.password=Piedrazul123.

spring.jpa.properties.hibernate.default_schema=piedrazul
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false

logging.level.org.springframework.security=DEBUG

server.port=8080

# --- Keycloak ---
# Valores para desarrollo local (backend fuera de Docker, Keycloak en localhost:8081).
# En Docker los sobrescribe docker-compose.yml con variables de entorno.
keycloak.realm=piedrazul
# Debe coincidir EXACTAMENTE con el claim "iss" de los tokens (URL publica de Keycloak).
keycloak.issuer-uri=http://localhost:8081/realms/piedrazul
# URL desde la que el backend descarga las claves publicas para verificar la firma.
keycloak.jwk-set-uri=http://localhost:8081/realms/piedrazul/protocol/openid-connect/certs
# Admin API: el backend crea usuarios en Keycloak con el client "piedrazul-backend".
keycloak.admin-url=http://localhost:8081
keycloak.admin-client-id=piedrazul-backend
keycloak.admin-client-secret=backend-dev-secret
